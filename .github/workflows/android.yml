name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/podcast_reader/engine/app.py"
      - "src/podcast_reader/types.py"
      - "services/premium/contracts/**"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/podcast_reader/engine/app.py"
      - "src/podcast_reader/types.py"
      - "services/premium/contracts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Sync engine contract dependencies
        run: uv sync --extra dev
        working-directory: .
      - name: Engine contract fixture parity
        run: uv run python scripts/check_engine_contract_fixtures.py
      - name: House-ad containment policy
        run: python3 scripts/check_ad_containment.py
      - name: Frozen ad consumer handoff parity
        run: python3 scripts/check_ad_contract_handoff.py
      - name: Unit tests, lint, and unsigned release assembly
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleRelease

  emulator-acceptance:
    name: Emulator acceptance (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [28, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Enable KVM for the disposable hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented acceptance and K4 sweep
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./android/scripts/run_emulator_acceptance.sh "$GITHUB_WORKSPACE/android/build/acceptance/api-${{ matrix.api-level }}"
      - name: Upload redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/build/acceptance/api-${{ matrix.api-level }}
            android/app/build/outputs/androidTest-results/connected
            android/app/build/reports/androidTests/connected

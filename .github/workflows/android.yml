name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/podcast_reader/engine/app.py"
      - "src/podcast_reader/types.py"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/podcast_reader/engine/app.py"
      - "src/podcast_reader/types.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Sync engine contract dependencies
        run: uv sync --extra dev
        working-directory: .
      - name: Engine contract fixture parity
        run: uv run python scripts/check_engine_contract_fixtures.py
      - name: Unit tests, lint, and unsigned release assembly
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleRelease
